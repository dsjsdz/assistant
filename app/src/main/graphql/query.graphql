query Config($input: String) {
  setting(input: $input) {
    id
    is_maintenance
    registrable
    resumed_at
    token
  }
}

query CanIUse($input: String!) {
  canIUse(input: $input)
}

query Auth {
  auth
}

query Profile {
  profile {
    id
    email
    username
    profile_url
    status
    email_verified_at
    permissions
    merchant {
      id
      title
      logo
      verified_at
      expired_at
      machine_nos
      is_dev
      debug
    }
    role {
      id
      name
      display_name
    }
  }
}

query Roles($input: String!, $filter: [String!]) {
  roles(input: $filter) {
    id
    name
    display_name
    description
    is_visible
    sort_id
    permission_ids
    menu_ids {
      selected_keys
      indeterminate_keys
    }
  }
  permissionTypes {
    id
    name
    display_name
    permissions {
      id
      name
      display_name
      is_visible
      is_premium
    }
  }
  menus(input: $input) {
    id
    name
    display_name
    children {
      id
      name
      display_name
      children {
        id
        name
        display_name
      }
    }
  }
}

