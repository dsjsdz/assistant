query Merchant($id: Int!, $filter: [String!]) {
  merchant(id: $id) {
    id
    title
    keywords
    description
    logo
    created_at
    expired_at
    verified_at
    status
    config {
      debug
      is_dev
      appid
      app_secret
      app_key
      whitelist_ip
      max_staff_count
      current_staff_count
      max_machine_count
      current_machine_count
      max_model_count
      current_model_count
      timezone
    }
    owner {
      id
      email
      username
      profile_url
      is_owner
      status
      machine_ids
      role_id
      alarm_config {
        id
        alarm_platform_id
        alarm_event_ids
      }
    }
  }
  roles(input: $filter) {
    id
    name
    display_name
    description
  }
}

